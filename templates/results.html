<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>
    <link rel="stylesheet" href="/static/assets/css/main.css">
</head>
<body>
    <h1>Prediction Results</h1>
    {% if results %}
        <p><strong>Prediction:</strong> {{ results.prediction }}</p>
        <p><strong>Confidence:</strong> {{ results.confidence }}%</p>
        <p><strong>Status:</strong> {{ results.status }}</p>
        <p><strong>Original Image:</strong></p>
        <img src="/static/uploads/{{ results.filename }}" alt="Uploaded Image" style="max-width:300px;">
        {% if results.gradcam_filename %}
            <p><strong>GradCAM Heatmap:</strong></p>
            <img src="/static/gradcam/{{ results.gradcam_filename }}" alt="GradCAM Heatmap" style="max-width:300px;">
        {% endif %}
    {% else %}
        <p>No results found.</p>
    {% endif %}
    <br>
    <a href="/preview">Try another image</a>
</body>
</html>
